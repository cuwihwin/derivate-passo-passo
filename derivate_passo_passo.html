<body>
<div id="app" class="app" data-schermata="scrivi">
  <div class="barra">
    <button type="button" id="modifica" class="modifica"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Modifica</button>
    <span class="barra-titolo">Derivate passo passo</span>
  </div>

  <header class="testa">
    <h1>Derivate passo passo</h1>
  </header>

  <noscript><p class="avviso-rosso">Per usare lo strumento serve JavaScript: attivalo nelle impostazioni del browser.</p></noscript>
  <p id="vecchio" class="avviso-rosso" hidden>Questo browser &#xE8; troppo vecchio per lo strumento: aggiornalo oppure apri la pagina con un browser recente.</p>

  <div class="colonne">
    <div class="sinistra">
      <section class="card funzione" aria-labelledby="tua-funzione">
        <div class="funzione-testa">
          <span class="lab" id="tua-funzione">LA TUA FUNZIONE</span>
          <button type="button" id="cancella" class="cancella">Cancella</button>
        </div>
        <div id="campo-posto" class="campo-posto"></div>
        <p id="aiuto" class="aiuto" hidden></p>
        <div class="esempi esempi-computer">
          <span class="esempi-lab">Esempi:</span>
          <span class="chips" id="esempi-computer"></span>
        </div>
      </section>

      <section id="messaggio" class="card messaggio" hidden></section>

      <div class="esempi esempi-telefono">
        <span class="lab">PROVA CON UN ESEMPIO</span>
